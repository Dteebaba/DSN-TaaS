<title>DSN Talent Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F5F7F5;--surface:#FEFEFE;--surface2:#FAFBFA;--ink:#1C2227;--muted:#5A6570;--line:#DFE4E0;--line2:#EDF0EE;
  --green:#0F9B4A;--green-text:#0A7338;--green-ink:#FFFFFF;--green-soft:#E3F3EA;--green-line:#AEDDC2;
  --red:#DE0728;--red-soft:#FDEBEE;--blue:#212E81;--blue-soft:#EBEDF7;--amber:#9A6200;--amber-soft:#FBF1DC;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 4px 16px rgba(20,40,25,.05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,44px)}h2{font-size:22px}h3{font-size:17px}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.01em}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--green) 0 60%,var(--red) 60% 80%,var(--blue) 80%)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand img{height:38px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
.brand span{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer;font-size:14px}
.nav button:hover{color:var(--ink);background:var(--line2)}
.nav button.on{color:var(--green-text);background:var(--green-soft)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip-user{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:12px;flex:none}
.av.lg{width:64px;height:64px;font-size:22px;font-family:var(--display)}
.av.masked{background:var(--line2);color:var(--muted)}
.modebar{background:var(--blue);color:#fff;font-size:12.5px}
.modebar .wrap{display:flex;gap:10px;align-items:center;min-height:30px;flex-wrap:wrap}
main{padding-block:28px 60px;min-height:70vh}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:980px){.split,.split.wide{grid-template-columns:1fr}.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.wrap{padding-inline:16px}.nav{order:3;flex-basis:100%}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge.verified{background:var(--green-soft);color:var(--green-text);border-color:var(--green-line)}
.badge.claimed{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.badge.pending{background:var(--amber-soft);color:var(--amber)}
.badge.rejected{background:var(--red-soft);color:var(--red)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.grey{background:var(--line2);color:var(--muted)}
.tick{width:14px;height:14px;flex:none}
.role-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.role-line:last-child{border-bottom:0}
.role-name{font-weight:600}
/* score */
.score-big{display:flex;align-items:baseline;gap:6px}
.score-big b{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score-big span{color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center}
.bar-row .lbl{font-size:13.5px;font-weight:600}
.bar-row .val{text-align:right;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:8px;background:var(--line2);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.default i{background:var(--muted);opacity:.5}
.mini{display:flex;gap:3px;height:6px;margin-top:6px}
.mini i{flex:1;background:var(--line2);border-radius:3px;overflow:hidden;position:relative}
.mini i b{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:3px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center;flex:none}
.ring.default{background:conic-gradient(var(--muted) calc(var(--p)*1%),var(--line2) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
/* talent cards */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--green-line);transform:translateY(-1px)}
.tcard .idl{display:flex;justify-content:space-between;gap:10px;align-items:start}
.tcard .nm{font-weight:700;font-size:15.5px}
.tcard .badge{white-space:normal}
.tcard .hd{font-size:13px;color:var(--muted);min-height:2.6em}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=url],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;font-size:14.5px;font-weight:400}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-line);border-color:var(--green)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:500;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--green)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.entry{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:12px}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* tiles */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile.alert{border-color:var(--amber);background:var(--amber-soft)}
/* misc */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--line2);border-radius:6px;padding:3px 9px;font-size:13px}
.lock{display:flex;gap:14px;align-items:flex-start;padding:18px;border:1px dashed var(--muted);border-radius:12px;background:var(--surface2)}
.note{padding:12px 14px;border-radius:10px;background:var(--blue-soft);color:var(--ink);font-size:14px}
.note.warn{background:var(--amber-soft)}
.note.ok{background:var(--green-soft)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.copyrow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;background:var(--surface)}
.copyrow code{flex:1;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.tl::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--green-text);border-bottom-color:var(--green)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:20px 36px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1 em{font-style:normal;color:var(--green-text)}
.hero .lede{font-size:18px;color:var(--muted);max-width:56ch;margin-top:14px}
.flag{display:inline-flex;height:4px;width:54px;border-radius:2px;overflow:hidden;margin-bottom:14px}
.flag i{flex:1;background:var(--green)}.flag i:nth-child(2){background:var(--line)}
.who3 .card h3{margin-bottom:6px}
.who3 ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
/* CV document */
.cv{background:#fff;color:#1b1f23;max-width:820px;margin:0 auto;border:1px solid var(--line);border-radius:4px;padding:48px 56px;box-shadow:var(--shadow);font-size:14px}
.cv h1{font-size:30px;color:#1b1f23}
.cv .cv-sub{color:#4a545d;margin-top:4px}
.cv .cv-bar{height:3px;background:linear-gradient(90deg,#0F9B4A 0 70%,#DE0728 70% 85%,#212E81 85%);margin:18px 0 22px}
.cv h4{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#0A7338;margin:22px 0 8px;border-bottom:1px solid #e3e7e4;padding-bottom:5px}
.cv .it{margin-bottom:12px}.cv .it-h{display:flex;justify-content:space-between;gap:10px;font-weight:700;flex-wrap:wrap}
.cv .it-m{color:#4a545d;font-size:13px}
.cv .vtag{display:inline-block;font-size:11px;font-weight:700;color:#0A7338;border:1px solid #8fd1ab;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.cv .ctag{display:inline-block;font-size:11px;font-weight:600;color:#6b747c;border:1px dashed #9aa3aa;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.cv .foot{margin-top:28px;padding-top:10px;border-top:1px solid #e3e7e4;font-size:11.5px;color:#6b747c}
@media (max-width:640px){.cv{padding:24px 18px}}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;z-index:60;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.rubric{font-size:13px;display:grid;grid-template-columns:52px 1fr;gap:4px 10px;margin-top:8px;color:var(--muted)}
.rubric b{font-family:var(--mono);color:var(--ink);font-weight:600}
.scorein{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line2)}
.foot{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:13px}

/* welcome page */
main.home{padding-block:0 0}
.welcome{position:relative;overflow:hidden;background:#FEFEFE;border-bottom:1px solid var(--line)}
.welcome canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.welcome .inner{position:relative;max-width:1240px;margin:0 auto;padding:clamp(56px,10vw,120px) 20px clamp(64px,10vw,128px);display:flex;flex-direction:column;align-items:flex-start;gap:22px;pointer-events:none}
.welcome .inner>*{pointer-events:auto}
.welcome .kicker{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);background:rgba(254,254,254,.85);padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line)}
.welcome .kicker img{height:22px;border-radius:4px}
.welcome h1{font-size:clamp(40px,7vw,84px);line-height:1.02;letter-spacing:-.03em;max-width:13ch}
.welcome h1 .g{color:var(--green)}
.welcome h1 .u{background:linear-gradient(transparent 72%,rgba(222,7,40,.22) 72%)}
.welcome .tag{font-size:clamp(17px,2vw,21px);color:var(--muted);max-width:44ch;background:rgba(254,254,254,.7)}
.welcome .cta{display:flex;gap:12px;flex-wrap:wrap}
.welcome .cta .btn{padding:13px 22px;font-size:15.5px;border-radius:11px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.2s}.rise.d3{animation-delay:.34s}.rise.d4{animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.doors{max-width:1240px;margin:-44px auto 0;padding-inline:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;position:relative;z-index:2}
.door{display:flex;flex-direction:column;gap:10px;text-align:left;padding:22px;border-radius:14px;border:0;cursor:pointer;color:#fff;min-height:150px;box-shadow:0 10px 30px rgba(20,40,30,.14);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.door:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,40,30,.2)}
.door.g{background:var(--green)}.door.b{background:var(--blue)}.door.r{background:var(--red)}
.door b{font-family:var(--display);font-size:22px}
.door span{opacity:.92;font-size:14.5px}
.door .arr{margin-top:auto;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.door .arr i{display:inline-block;transition:transform .2s;font-style:normal}
.door:hover .arr i{transform:translateX(5px)}
.door::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
@media (max-width:760px){.doors{grid-template-columns:1fr;margin-top:-28px}}
.numbers{max-width:1240px;margin:56px auto 0;padding-inline:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.numbers div{border-top:3px solid var(--green);padding-top:12px}
.numbers div:nth-child(2){border-color:var(--red)}.numbers div:nth-child(3){border-color:var(--blue)}
.numbers b{display:block;font-family:var(--display);font-size:clamp(36px,5vw,56px);font-variant-numeric:tabular-nums;line-height:1}
.numbers span{color:var(--muted);font-weight:600}
.meet{max-width:1240px;margin:64px auto 0;padding:0 20px 72px}
@media (prefers-reduced-motion:reduce){.rise{animation:none}.door{transition:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function mask(name){return String(name||"").split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()+"*".repeat(Math.max(3,w.length-1))).join(" ")}
function initials(name){return String(name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")}
function total(m){const s=m?.scores||{};return CATS.reduce((a,c)=>a+(+s[c.k]||0),0)}
function verifiedRoles(m){return(m.roles||[]).filter(r=>r.status==="verified")}
function levelRank(l){return LEVELS.indexOf(l)}
function topRole(m){const v=verifiedRoles(m).sort((a,b)=>levelRank(b.level)-levelRank(a.level));if(v.length)return v[0];return(m.roles||[])[0]||null}
function completeness(m){let p=0;if(m.headline)p+=10;if((m.summary||"").length>40)p+=15;if((m.skills||[]).length>=3)p+=10;if((m.experience||[]).length)p+=20;if((m.projects||[]).length)p+=20;if((m.education||[]).length)p+=15;if((m.certifications||[]).length)p+=10;return p}

function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const ch of s){h=(h*31+ch.charCodeAt(0))|0}return"x"+h}}
async function hashPw(pw){const salt=Math.random().toString(36).slice(2,10);return{salt,pwHash:await sha(salt+":"+pw)}}
async function checkPw(acc,pw){return acc&&acc.pwHash&&(await sha(acc.salt+":"+pw))===acc.pwHash}

/* ---------- storage ---------- */
function saveLocal(){if(MODE==="local")lsSet("dsn_tp_data_v1",JSON.stringify(S))}
function seedObj(){return JSON.parse(document.getElementById("seed").textContent)}
async function put(col,id,data){S[col]={...S[col],[id]:data};if(MODE==="db"){try{await DB.doc(col+"/"+id).set(data)}catch(e){toast("Couldn't save: "+(e.code||e.message));throw e}}else saveLocal();scheduleRender()}
async function remove(col,id){const o={...S[col]};delete o[id];S[col]=o;if(MODE==="db"){try{await DB.doc(col+"/"+id).delete()}catch(e){toast("Couldn't delete: "+(e.code||e.message))}}else saveLocal();scheduleRender()}
async function loadSample(){const s=seedObj();for(const c of COLS){for(const[id,d]of Object.entries(s[c]||{})){if(!S[c][id])await put(c,id,d)}}toast("Sample data loaded")}
async function initStore(){
  try{DB=(window.claude&&window.claude.use)?await window.claude.use("db"):null}catch(e){DB=null}
  try{USER=(window.claude&&window.claude.use)?await window.claude.use("user"):null}catch(e){USER=null}
  try{DL=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null}catch(e){DL=null}
  if(DB){
    MODE="db";
    await new Promise(res=>{let pending=COLS.length;const done=()=>{if(--pending===0)res()};
      COLS.forEach(c=>{let first=true;DB.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[c]=o;if(first){first=false;done()}else scheduleRender()},err=>{console.warn(c,err);if(first){first=false;done()}})});
      setTimeout(res,9000)});
  }else{
    MODE="local";
    const raw=lsGet("dsn_tp_data_v1");let ok=false;
    if(raw){try{const o=JSON.parse(raw);COLS.forEach(c=>S[c]=o[c]||{});ok=true}catch(e){}}
    if(!ok){const s=seedObj();COLS.forEach(c=>S[c]=clone(s[c]||{}));saveLocal()}
  }
  if(USER){try{CAN_ADMIN=!!(await USER.isOwner())||!!(await USER.canEdit())}catch(e){CAN_ADMIN=false}}else CAN_ADMIN=(MODE==="local");
  try{SESSION=JSON.parse(lsGet("dsn_tp_session")||"null")}catch(e){SESSION=null}
  if(SESSION&&!acctOf(SESSION))SESSION=null;
  READY=true;
}
function acctOf(s){if(!s)return null;if(s.kind==="member")return S.members[s.id];if(s.kind==="recruiter")return S.recruiters[s.id];if(s.kind==="reviewer")return S.reviewers[s.id];if(s.kind==="admin")return CAN_ADMIN?{id:"admin"}:null;return null}
function setSession(s){SESSION=s;if(s)lsSet("dsn_tp_session",JSON.stringify(s));else lsDel("dsn_tp_session")}
const me=()=>acctOf(SESSION);
const isRecruiter=()=>SESSION?.kind==="recruiter";
const isSubscribed=()=>isRecruiter()&&me()?.status==="approved"&&me()?.subscribed;

const VIEWS={};
function render(){
  const app=$("#app");
  if(!READY){app.innerHTML=`<div class="wrap" style="padding-block:80px"><p class="muted">Loading DSN Talent Platform…</p></div>`;return}
  const guard={member:/^m-/,reviewer:/^r-/,recruiter:/^rc-(requests|plan)$/,admin:/^a-/};
  for(const[k,re]of Object.entries(guard)){if(re.test(R.name)&&!(SESSION?.kind===k&&acctOf(SESSION))){R={name:"login",p:{kind:k==="admin"?"member":k}};if(k==="admin"){R={name:"home",p:{}}}}}
  let body="";
  try{body=(VIEWS[R.name]||VIEWS.home)(R.p)}catch(e){console.error(e);body=`<div class="card"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p></div>`}
  app.innerHTML=header()+(R.name==="home"?`<main class="home">${body}</main>`:`<main><div class="wrap">${body}</div></main>`)+footer();
  afterRender();
}
let afterHooks=[];

function roleBadge(r,{short=false}={}){

  if(r.status==="verified")return`<span class="badge verified">${ICON.check}${esc(r.role)} · ${esc(r.level)}</span>`;
  if(r.status==="pending")return`<span class="badge pending">${esc(r.role)}${short?"":" · verification in progress"}</span>`;
  return`<span class="badge claimed">${esc(r.role)} · Claimed, not verified</span>`;
}
function statusBadge(st){const m={submitted:["pending","Awaiting reviewer"],interview:["blue","Interview requested"],completed:["verified","Completed"],rejected:["rejected","Not verified"],pending:["pending","Pending"],approved:["verified","Approved"],new:["pending","New"],shortlisting:["blue","Shortlisting"],shared:["blue","Profiles shared"],interviewing:["blue","Interviewing"],placed:["verified","Placed"],closed:["grey","Closed"]};const[c,l]=m[st]||["grey",st];return`<span class="badge ${c}">${esc(l)}</span>`}
function scoreStatusText(m){if(m.scoreStatus==="reviewed")return`Reviewed by DSN on ${fmtD(m.reviewedAt)}.`;if(m.scoreStatus==="pending")return"Review in progress. Showing starting scores.";return"Starting scores (5 per category) until the profile is reviewed."}

  <div class="bars">${CATS.map(c=>{const v=+(m.scores||{})[c.k]||0;return`<div class="bar-row"><span class="lbl">${esc(c.label)}</span><span class="val">${v}/20</span><div class="bar ${def?"default":""}" role="img" aria-label="${esc(c.label)} ${v} out of 20"><i style="width:${v*5}%"></i></div></div>`}).join("")}</div>

function ring(m){const t=total(m);return`<div class="ring ${m.scoreStatus!=="reviewed"?"default":""}" style="--p:${t}" aria-label="Rating ${t} out of 100"><span>${t}</span></div>`}
function miniBars(m){return`<div class="mini" aria-hidden="true">${CATS.map(c=>`<i title="${esc(c.short)} ${(m.scores||{})[c.k]||0}/20"><b style="width:${((m.scores||{})[c.k]||0)*5}%"></b></i>`).join("")}</div>`}

let netRAF=0;
function startWelcome(){
  cancelAnimationFrame(netRAF);
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-count]").forEach(el=>{const n=+el.dataset.count;if(reduce||!n)return;const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/1200);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};el.textContent="0";requestAnimationFrame(step)});
  const c=$("#net");if(!c)return;const ctx=c.getContext("2d");const COLS=["#0F9B4A","#0F9B4A","#0F9B4A","#DE0728","#212E81","#212E81"];
  let W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1),pts=[];
  const size=()=>{const r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const n=Math.round(Math.min(90,W*H/14000));pts=Array.from({length:n},()=>({x:W*.35+Math.random()*W*.65,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:2+Math.random()*3,c:COLS[Math.floor(Math.random()*COLS.length)],sq:Math.random()<.45}))};
  size();window.onresize=()=>{if($("#net"))size()};
  const draw=()=>{ctx.clearRect(0,0,W,H);
    for(let i=0;i<pts.length;i++){const p=pts[i];for(let j=i+1;j<pts.length;j++){const q=pts[j];const dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<13000){ctx.strokeStyle="rgba(15,155,74,"+(0.16*(1-d/13000))+")";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}}
    pts.forEach(p=>{const fade=Math.min(1,Math.max(0,(p.x-W*.25)/(W*.2)));ctx.globalAlpha=.25+.6*fade;ctx.fillStyle=p.c;if(p.sq)ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}ctx.globalAlpha=1});};
  const tick=()=>{if(!document.body.contains(c))return;pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<W*.2||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});draw();netRAF=requestAnimationFrame(tick)};
  if(reduce)draw();else tick();
}

async function downloadCV(id){

  const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"a4"});const W=595,L=48,R=W-48;let y=56;
  const need=h=>{if(y+h>790){doc.addPage();y=56}};
  const txt=(s,{size=10,bold=false,color=[27,31,35],indent=0,gap=4}={})=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.setTextColor(...color);const lines=doc.splitTextToSize(String(s||""),R-L-indent);lines.forEach(l=>{need(size+2);doc.text(l,L+indent,y);y+=size+3});y+=gap};
  const head=t=>{y+=6;need(24);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(15,155,74);doc.text(t.toUpperCase(),L,y);y+=5;doc.setDrawColor(220,226,222);doc.line(L,y,R,y);y+=14};
  const clean=s=>String(s||"").replace(/[–—]/g,"-").replace(/₦/g,"NGN ").replace(/[^\x00-\xFF]/g,"");
  doc.setFont("helvetica","bold");doc.setFontSize(22);doc.setTextColor(27,31,35);doc.text(clean(m.name),L,y);
  doc.setFontSize(24);doc.setTextColor(15,155,74);doc.text(String(total(m)),R-34,y,{align:"right"});doc.setFontSize(10);doc.setTextColor(107,116,124);doc.text("/100",R,y,{align:"right"});y+=16;
  txt(clean(m.headline),{size:11,color:[74,84,93],gap:0});txt("DSN ID "+m.dsnId+(m.location?"  |  "+clean(m.location):"")+"  |  DSN Rating "+(m.scoreStatus==="reviewed"?"reviewed "+fmtD(m.reviewedAt):"not yet reviewed"),{size:9,color:[107,116,124]});
  doc.setFillColor(15,155,74);doc.rect(L,y,(R-L)*.7,3,"F");doc.setFillColor(222,7,40);doc.rect(L+(R-L)*.7,y,(R-L)*.15,3,"F");doc.setFillColor(33,46,129);doc.rect(L+(R-L)*.85,y,(R-L)*.15,3,"F");y+=16;
  head("Profile");txt(clean(m.summary));
  head("Roles");(m.roles||[]).forEach(r=>txt(clean(r.role)+(r.status==="verified"?"  -  DSN VERIFIED ("+r.level+")":"  -  Claimed, not verified"),{bold:r.status==="verified",gap:1}));y+=3;
  head("DSN Rating breakdown");CATS.forEach(c=>txt(c.label+": "+((m.scores||{})[c.k]||0)+"/20",{gap:0}));y+=4;
  head("Skills");txt(clean((m.skills||[]).join("  |  ")));
  head("Work experience");(m.experience||[]).forEach(e=>{txt(clean(e.role+", "+e.company),{bold:true,gap:0});txt(fmtYM(e.start)+" - "+(e.current?"Present":fmtYM(e.end)),{size:9,color:[107,116,124],gap:1});txt(clean(e.description),{gap:8})});
  head("Projects");(m.projects||[]).forEach(p=>{txt(clean(p.title),{bold:true,gap:0});if(p.tools)txt(clean(p.tools),{size:9,color:[107,116,124],gap:1});txt(clean((p.description||"")+(p.outcome?" Outcome: "+p.outcome+".":"")),{gap:p.link?0:8});if(p.link)txt(clean(p.link),{size:9,color:[47,60,145],gap:8})});
  head("Education");(m.education||[]).forEach(e=>{txt(clean(e.degree+" "+e.field+" ("+e.year+")"),{bold:true,gap:0});txt(clean(e.school),{size:9,color:[107,116,124],gap:6})});
  head("Certifications");(m.certifications||[]).forEach(c=>{txt(clean(c.name+" ("+c.year+")"),{bold:true,gap:0});txt(clean(c.issuer),{size:9,color:[107,116,124],gap:6})});
  if((m.achievements||[]).filter(Boolean).length){head("Achievements");m.achievements.filter(Boolean).forEach(a=>txt("- "+clean(a),{gap:1}))}
  y+=10;txt("Generated from the DSN Talent Platform on "+fmtD(now())+". DSN VERIFIED items were checked by a DSN peer reviewer. To engage this member, send a talent request through DSN.",{size:8,color:[107,116,124]});
  const blob=doc.output("blob");const fname="DSN-CV-"+m.dsnId+".pdf";
  if(DL){try{await DL.save({filename:fname,data:blob});toast("CV ready")}catch(e){if(e.code!=="declined")toast("Download didn't start: "+(e.message||e.code))}}
  else{try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove()}catch(e){toast("Downloads aren't available in this view")}}
}

async function submitApply(e){

async function submitLogin(e){
  e.preventDefault();const f=e.target;const kind=f.dataset.kind,step=f.dataset.step;const err=$("#l-err");const fail=t=>{err.hidden=false;err.textContent=t};
  const col=kind==="member"?"members":kind==="recruiter"?"recruiters":"reviewers";
  if(step==="id"){
    let raw=($("#l-id").value||"").trim();if(!raw)return fail("Enter your "+(kind==="member"?"DSN ID":"ID")+".");
    let id=cleanId(raw);
    if(kind==="recruiter"&&raw.includes("@")){const r=Object.values(S.recruiters).find(r=>(r.email||"").toLowerCase()===raw.toLowerCase());if(r)id=r.id}
    const acc=S[col][id];
    if(!acc){if(kind==="member"&&S.applications[id]?.status==="pending")return fail("Your application is still being reviewed. You can log in once DSN creates your profile.");return fail(kind==="member"?"No profile found for "+id+". Check the ID or apply first.":"No account found for that ID.")}
    if(kind==="recruiter"&&acc.status==="pending")return fail("Your company registration is awaiting DSN approval.");
    if(kind==="recruiter"&&acc.status==="rejected")return fail("This recruiter account isn't active. Contact DSN.");
    if(kind==="reviewer"&&acc.active===false)return fail("This reviewer account is inactive.");
    R.p={kind,id,step:acc.pwHash?"pw":"create"};render();return;
  }
  const id=f.dataset.id;const acc=S[col][id];if(!acc)return fail("Account not found.");
  if(step==="pw"){if(!(await checkPw(acc,$("#l-pw").value)))return fail("That password doesn't match. Try again or reset it.");setSession({kind,id});toast("Logged in");go(kind==="member"?"m-home":kind==="reviewer"?"r-queue":"directory");return}
  const email=($("#l-email").value||"").trim().toLowerCase(),p1=$("#l-pw1").value,p2=$("#l-pw2").value;
  if((acc.email||"").toLowerCase()!==email)return fail("That email doesn't match our records for "+id+". Contact DSN if it has changed.");
  if(p1.length<8)return fail("Use at least 8 characters.");if(p1!==p2)return fail("The two passwords don't match.");
  const h=await hashPw(p1);const upd={...clone(acc),...h,pwSetAt:now()};await put(col,id,upd);setSession({kind,id});toast(step==="create"?"Password created":"Password reset");go(kind==="member"?"m-home":kind==="reviewer"?"r-queue":"directory");
}

async function submitRc(e){e.preventDefault();const v=id=>($("#"+id)?.value||"").trim();const err=$("#c-err");const fail=t=>{err.hidden=false;err.textContent=t};

async function rvInterview(id){const r=clone(S.requests[id]);const when=$("#iv-when").value;if(!when){toast("Pick a date and time");return}r.interview={when,link:$("#iv-link").value.trim(),note:$("#iv-note").value.trim()};r.status="interview";r.reviewerId=SESSION.id;(r.history=r.history||[]).push({at:now(),by:SESSION.id,text:"Interview requested for "+fmtDT(when)+"."});await put("requests",id,r);toast("Interview request sent to member")}
async function rvSubmitRole(id){
  const r=clone(S.requests[id]);const m=clone(S.members[r.memberId]);const dec=document.querySelector("input[name=rv-dec]:checked").value;const note=$("#rv-note").value.trim();
  if(dec!=="verified"&&!note){toast("Add a note explaining your decision");return}
  const roles=m.roles||[];let claimed=roles.find(x=>x.role===r.role);let text;
  if(dec==="rejected"){if(claimed&&claimed.status!=="verified"){claimed.status="claimed";claimed.note=note}r.status="rejected";r.outcome={action:"rejected",note};text="Not verified for "+r.role+"."}
  else{const role=dec==="changed"?$("#rv-role").value:r.role;const level=dec==="changed"?$("#rv-level").value:r.level;if(!role||!level){toast("Choose the role and level");return}
    if(dec==="changed"&&role!==r.role&&claimed&&claimed.status!=="verified"){claimed.status="claimed";claimed.note="Reviewer verified "+role+" instead."}
    let target=roles.find(x=>x.role===role);if(!target){target={role};roles.push(target)}
    Object.assign(target,{level,status:"verified",verifiedAt:now(),verifiedBy:SESSION.id,note:dec==="changed"?note:""});
    r.status="completed";r.outcome={action:dec,role,level,note};text=(dec==="changed"?"Verified with changes: ":"Verified as ")+role+" · "+level+".";}
  m.roles=roles;r.completedAt=now();r.reviewerId=SESSION.id;(r.history=r.history||[]).push({at:now(),by:SESSION.id,text});
  await put("members",m.dsnId,m);await put("requests",id,r);toast("Decision saved and shown on the member's profile");go("r-queue");
}
async function rvSubmitRating(id){
  const r=clone(S.requests[id]);const m=clone(S.members[r.memberId]);const sc={};
  for(const c of CATS){const v=$("#sc-"+c.k).value;if(v===""||+v<0||+v>20||!Number.isInteger(+v)){toast(c.label+" needs a whole number from 0 to 20");return}sc[c.k]=+v}
  const t=Object.values(sc).reduce((a,b)=>a+b,0);
  m.scores=sc;m.scoreStatus="reviewed";m.reviewedAt=now();m.lastReviewer=SESSION.id;
  r.status="completed";r.scores=sc;r.completedAt=now();r.reviewerId=SESSION.id;r.outcome={action:"scored",note:$("#rv-note").value.trim(),total:t};(r.history=r.history||[]).push({at:now(),by:SESSION.id,text:"Scored "+t+"/100."});
  await put("members",m.dsnId,m);await put("requests",id,r);toast("Scores published: "+t+"/100");go("r-queue");
}

   case"copy":{const t=a.dataset.text;try{await navigator.clipboard.writeText(t);toast("Copied")}catch(x){const c=a.previousElementSibling;const rg=document.createRange();rg.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(rg);toast("Selected. Press Ctrl+C to copy")}break}
   case"show-rubric":modal(`<div class="stack"><div class="row between"><h2>DSN Rating rubric</h2><button class="btn sm ghost" data-act="close-modal">Close</button></div><p class="small muted">Five categories × 20 points. New profiles start at 5 per category until reviewed.</p>${rubricHTML()}</div>`,{wide:true});break;
   case"tab":UI.tab[a.dataset.tab]=a.dataset.val;render();break;
   case"login-tab":UI.tab.login=a.dataset.kind;R.p={kind:a.dataset.kind};render();break;
   case"login-reset":R.p={kind:R.p.kind};render();break;
   case"login-forgot":R.p={...R.p,step:"forgot"};render();break;
   case"download-cv":downloadCV(id);break;
   case"request-talent":if(!isRecruiter()){go("login",{kind:"recruiter"});break}if(id&&!isSubscribed()){go("rc-plan");break}talentRequestModal(id);break;
   case"req-rating":processModal("rating");break;
   case"req-role":processModal("role",a.dataset.role);break;
   case"confirm-process":confirmProcess(a.dataset.kind,a.dataset.role);break;
   case"add-role":addRoleModal();break;
   case"update-status":statusModal();break;
   case"cv-add":DRAFT[a.dataset.sec]=[...(DRAFT[a.dataset.sec]||[]),clone(SECTIONS[a.dataset.sec].blank)];render();break;
   case"cv-del":DRAFT[a.dataset.sec].splice(+a.dataset.i,1);render();break;
   case"cv-move":{const arr=DRAFT[a.dataset.sec],i=+a.dataset.i,j=i+ +a.dataset.dir;[arr[i],arr[j]]=[arr[j],arr[i]];render();break}
   case"cv-discard":DRAFT=null;render();toast("Changes discarded");break;
   case"cv-save":{const cur=me();const d=clone(DRAFT);const keep=["roles","scores","scoreStatus","reviewedAt","premium","pwHash","salt","impact","employmentStatus","currentTitle","currentOrg","visible","openToWork","email","phone","name","dsnId","createdAt"];keep.forEach(k=>d[k]=cur[k]);d.updatedAt=now();await put("members",cur.dsnId,d);DRAFT=null;toast("CV saved");go("m-home");break}
   case"rv-interview":rvInterview(id);break;
   case"rv-submit-role":rvSubmitRole(id);break;
   case"rv-submit-rating":rvSubmitRating(id);break;
   case"req-sub":{const r=clone(me());r.subRequested=true;r.subRequestedAt=now();await put("recruiters",r.id,r);toast("Request sent to DSN");break}
   case"load-sample":await loadSample();break;
   case"view-app":appModal(id);break;
   case"approve-app":approveApp(id);break;
   case"reject-app":rejectApp(id);break;
   case"new-member":newMemberModal();break;
   case"admin-member":adminMemberModal(id);break;
   case"save-override":{const m=clone(S.members[id]);CATS.forEach(c=>{m.scores[c.k]=Math.max(0,Math.min(20,Math.round(+$("#ov-"+c.k).value||0)))});m.scoreStatus=$("#ov-status").value||m.scoreStatus;if(m.scoreStatus==="reviewed"&&!m.reviewedAt)m.reviewedAt=now();(m.adminLog=m.adminLog||[]).push({at:now(),text:"Scores overridden to "+total(m)});await put("members",id,m);closeModal();toast("Scores updated");break}
   case"reset-pw":{const col=a.dataset.kind;const o=clone(S[col][id]);o.pwHash="";o.salt="";await put(col,id,o);toast("Password cleared. They'll create a new one at next log in.");break}
   case"toggle-hide":{const m=clone(S.members[id]);m.visible=m.visible===false;await put("members",id,m);closeModal();toast(m.visible?"Shown in directory":"Hidden from directory");break}
   case"new-reviewer":newReviewerModal();break;
   case"rv-active":{const r=clone(S.reviewers[id]);r.active=r.active===false;await put("reviewers",id,r);break}
   case"rc-approve":case"rc-reject":{const r=clone(S.recruiters[id]);r.status=act==="rc-approve"?"approved":"rejected";await put("recruiters",id,r);toast("Recruiter "+r.status);break}
   case"rc-sub":subModal(id);break;
   case"sub-save":{const r=clone(S.recruiters[id]);r.subscribed=true;r.subRequested=false;r.subscribedUntil=$("#sub-until").value;await put("recruiters",id,r);closeModal();toast("Subscription active");break}
   case"sub-end":{const r=clone(S.recruiters[id]);r.subscribed=false;await put("recruiters",id,r);closeModal();toast("Subscription ended");break}
   case"tr-save":{const t=clone(S.talentRequests[id]);t.shortlist=$("#tr-sl-"+id).value.split(",").map(cleanId).filter(Boolean);const bad=t.shortlist.filter(x=>!S.members[x]);if(bad.length){toast("Unknown DSN ID: "+bad.join(", "));return}t.adminNote=$("#tr-note-"+id).value.trim();if(t.status==="new"&&t.shortlist.length)t.status="shared";await put("talentRequests",id,t);toast("Saved. The partner can see this now.");break}
   case"tr-suggest":{const t=S.talentRequests[id];const ms=Object.values(S.members).filter(m=>m.visible!==false&&m.openToWork!==false).map(m=>({m,v:(m.roles||[]).some(r=>r.role===t.roleNeeded&&r.status==="verified"),c:(m.roles||[]).some(r=>r.role===t.roleNeeded)})).filter(x=>x.c).sort((a,b)=>(b.v-a.v)||total(b.m)-total(a.m)).slice(0,6);$("#sugg-"+id).innerHTML=ms.length?`<div class="small muted" style="margin-bottom:6px">Members with this role, verified first:</div><div class="chips">${ms.map(x=>`<span class="chip"><span class="mono">${esc(x.m.dsnId)}</span> ${esc(x.m.name)} · ${total(x.m)} ${x.v?"✓":"(claimed)"}</span>`).join("")}</div>`:`<p class="small muted">No members list this role yet.</p>`;break}
   case"export-csv":exportCSV();break;
  }
});
document.addEventListener("change",async e=>{
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  if(act==="toggle-vis"||act==="toggle-otw"){const m=clone(me());if(act==="toggle-vis")m.visible=a.checked;else m.openToWork=a.checked;await put("members",m.dsnId,m);toast("Saved")}
  if(act==="toggle-premium"){const m=clone(S.members[id]);m.premium=a.checked;await put("members",id,m);toast(m.premium?"Premium on":"Premium off")}
  if(act==="rv-perm"){const r=clone(S.reviewers[id]);r[a.dataset.f]=a.checked;await put("reviewers",id,r)}
  if(act==="assign"){const r=clone(S.requests[id]);r.reviewerId=a.value;(r.history=r.history||[]).push({at:now(),by:"admin",text:a.value?"Assigned to "+a.value+".":"Unassigned."});await put("requests",id,r);toast("Assigned")}
  if(act==="tr-status"){const t=clone(S.talentRequests[id]);t.status=a.value;await put("talentRequests",id,t);toast("Status updated")}
  if(e.target.name==="rv-dec"){}
});
document.addEventListener("input",e=>{if(e.target.id==="mq"){UI.tab.mq=e.target.value;clearTimeout(window.__mq);window.__mq=setTimeout(()=>{render();const i=$("#mq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)}});
document.addEventListener("submit",async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==="apply-form")return submitApply(e);
  if(f.id==="login-form")return submitLogin(e);
  if(f.id==="rc-form")return submitRc(e);
  if(f.id==="tr-form")return submitTR(e);
  if(f.id==="addrole-form"){const role=$("#ar-role").value,level=$("#ar-level").value;if(!role||!level){toast("Choose a role and level");return}const m=clone(me());if((m.roles||[]).some(r=>r.role===role)){toast("That role is already on your profile");return}(m.roles=m.roles||[]).push({role,level,status:"claimed",note:""});await put("members",m.dsnId,m);closeModal();toast("Role added");return}
  if(f.id==="status-form"){const m=clone(me());const st=$("#us-emp").value;if(!st){toast("Choose a status");return}m.employmentStatus=st;m.currentTitle=$("#us-title").value.trim();m.currentOrg=$("#us-org").value.trim();(m.impact=m.impact||[]).push({date:now(),status:st,title:m.currentTitle,org:m.currentOrg,source:"Member update"});await put("members",m.dsnId,m);closeModal();toast("Status updated");return}
  if(f.id==="nm-form"){const v=i=>($("#"+i).value||"").trim();const id=cleanId(v("nm-id"));const err=$("#nm-err");if(!id||!v("nm-name")||!/^\S+@\S+\.\S+$/.test(v("nm-email"))||!v("nm-emp")||!v("nm-role")){err.hidden=false;err.textContent="Fill in every required field.";return}if(S.members[id]){err.hidden=false;err.textContent="A profile with that DSN ID already exists.";return}
    await put("applications",id,{dsnId:id,name:v("nm-name"),email:v("nm-email"),state:v("nm-state"),employmentStatus:v("nm-emp"),primaryRole:v("nm-role"),otherRoles:[],programmes:[],status:"pending",createdAt:now(),source:"Admin"});await approveApp(id);return}
  if(f.id==="nr-form"){const name=$("#nr-name").value.trim(),email=$("#nr-email").value.trim();const err=$("#nr-err");if(!name||!/^\S+@\S+\.\S+$/.test(email)){err.hidden=false;err.textContent="Add a name and valid email.";return}let n=1;while(S.reviewers["RV-"+String(n).padStart(3,"0")])n++;const id="RV-"+String(n).padStart(3,"0");await put("reviewers",id,{id,name,email,expertise:$("#nr-exp").value.trim(),canRole:$("#nr-role").checked,canRating:$("#nr-rate").checked,active:true,createdAt:now(),salt:"",pwHash:""});closeModal();toast("Reviewer "+id+" created. They log in with this ID and set a password.");return}
  if(f.id==="set-form"){const lines=i=>$("#"+i).value.split("\n").map(s=>s.trim()).filter(Boolean);const st={...clone(settings()),verifyEmail:$("#st-email").value.trim(),roleDocs:lines("st-roledocs"),ratingDocs:lines("st-ratedocs"),processNote:$("#st-note").value.trim(),premiumNote:$("#st-prem").value.trim(),roles:lines("st-roles"),programmes:lines("st-progs"),updatedAt:now()};await put("settings","main",st);toast("Settings saved");return}
});
function wire(){if(R.name==="directory")bindDir();if(R.name==="m-edit")bindCV()}
const _render=render;render=function(){_render();wire()};
(async()=>{render();await initStore();const h=(location.hash||"").slice(1);if(h&&VIEWS[h]&&!/^(talent|cv|r-task)$/.test(h))R={name:h,p:{}};else if(SESSION)R={name:SESSION.kind==="member"?"m-home":SESSION.kind==="reviewer"?"r-queue":SESSION.kind==="admin"?"a-home":"directory",p:{}};render()})();
</script>
