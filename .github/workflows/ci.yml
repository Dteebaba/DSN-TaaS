name: CI
on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  frontend:
    name: Frontend (syntax + end-to-end tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/test-results }

  backend:
    name: Backend (migrations + access rules)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 backend/tools/make_seed.py && git diff --exit-code backend/supabase/seed.sql
      - run: backend/tests/run.sh
        env: { DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres" }
